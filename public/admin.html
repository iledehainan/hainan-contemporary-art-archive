<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>档案管理 · 海南当代艺术文献</title>
  <meta name="robots" content="noindex" />
  <link rel="stylesheet" href="/assets/css/main.css" />
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
</head>
<body class="admin-body">
  <div id="admin-root">
    <div class="login-wrap">
      <div class="loading-row skeleton" style="width:200px;height:30px"></div>
    </div>
  </div>

  <div class="drawer-mask" id="drawer-mask"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawer-title">编辑</h2>
      <button class="drawer-close" type="button" id="drawer-close" aria-label="关闭">×</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot">
      <span class="hint" id="drawer-hint">带 * 为必填项</span>
      <span>
        <button class="btn ghost" type="button" id="drawer-cancel">取消</button>
        <button class="btn" type="button" id="drawer-save">保存</button>
      </span>
    </div>
  </aside>

  <div class="toast" id="toast"></div>

  <script src="/assets/js/app.js"></script>
  <script src="/assets/js/admin.js"></script>
</body>
</html>
